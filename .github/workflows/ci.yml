name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl python-docx

      - name: Run tests
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          cd tests
          python test_gate_ir.py
          python test_batch2_writeback.py
          python test_batch3_queries.py
          python test_batch4_lineage.py
          python test_batch5_reports.py
          python test_ledger_fixes.py
          python test_audit_gate_tiers.py
          python test_source_reconciliation.py

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate JSON files
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          echo "--- Checking schema files ---"
          python -c "
          import json, glob, sys
          errors = []
          for f in glob.glob('**/*.json', recursive=True):
              try:
                  with open(f, encoding='utf-8-sig') as fh:
                      json.load(fh)
              except Exception as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('JSON errors found:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          print('All JSON files valid')
          "
